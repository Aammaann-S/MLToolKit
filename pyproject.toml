[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MLToolKit"
version = "1.1.0"
description = "Installable machine-learning toolkit and import-aware VS Code completions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit" }]
keywords = ["machine-learning", "scikit-learn", "vscode", "snippets", "data-science"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
imbalanced = ["imbalanced-learn>=0.12"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
explain = ["shap>=0.44", "lime>=0.2"]
torch = ["torch>=2.1"]
tensorflow = ["tensorflow>=2.16"]
deploy = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "flask>=3.0"]
mlops = ["mlflow>=2.10"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["MLToolKit*"]

[tool.setuptools.package-data]
MLToolKit = ["catalog.json", "implementations/**/*.py", "implementations/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
